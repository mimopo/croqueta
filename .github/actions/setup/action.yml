name: Setup Project
description: Set up Vite+, Node.js and pnpm, and install dependencies
runs:
  using: 'composite'
  steps:
    - uses: voidzero-dev/setup-vp@v1.22.0
      with:
        version-file: 'pnpm-workspace.yaml'
        node-version-file: '.node-version'
        cache: true
        run-install: |
          args: ['--frozen-lockfile']
