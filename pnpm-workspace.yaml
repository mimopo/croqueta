packages:
  - 'packages/*'
  - 'examples/*'
allowBuilds:
  '@parcel/watcher': false
overrides:
  '@microsoft/api-extractor': '^7.60.1'
  ajv: '^8.17.1'
  lodash: '^4.18.1'
  minimatch: '^10.2.1'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  # TypeDoc and Volar require TypeScript <7; share the root compiler version.
  typescript@*: 'catalog:'
catalog:
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  '@vitest/coverage-v8': 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
